name: Public GitHub build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: "Description:"
        default: "Manual build from source"
  pull_request:
    branches: [ "**" ]

jobs:

  build:
    runs-on: windows-latest
    env:
      CONFIGURATION: Release
      PLATFORM: x64

    steps:

    - name: Get current date
      id: date
      shell: bash
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install NSIS
      run: choco install nsis -y

    - name: Install NSIS 7z plugin
      shell: pwsh
      run: |
        $downloadUrl = "https://nsis.sourceforge.io/mediawiki/images/6/69/Nsis7z_19.00.7z"
        $tempPath = "$env:TEMP\Nsis7z_19.00.7z"
        $extractPath = "$env:TEMP\NsisExtracted"
        $nsisDir = "C:\Program Files (x86)\NSIS"
        Invoke-WebRequest -Uri $downloadUrl -OutFile $tempPath
        7z x "$tempPath" -o"$extractPath" -y
        foreach ($folder in @("Contrib", "Plugins")) {
          $src = Join-Path $extractPath $folder
          $dst = Join-Path $nsisDir $folder
          if (Test-Path $src) { Copy-Item -Path "$src\*" -Destination $dst -Recurse -Force }
        }

    - name: Restore NuGet packages
      run: nuget restore TcNo-Acc-Switcher-Server\TcNo-Acc-Switcher-Server.sln

    # --- Build all projects using msbuild (matches appveyor.yml, resolves $(SolutionDir)) ---

    - name: Publish Installer (self-contained)
      run: >
        dotnet publish TcNo-Acc-Switcher-Installer/TcNo-Acc-Switcher-Installer.csproj
        -c Release -r win-x64 --self-contained true
        -o ${{ github.workspace }}\TcNo-Acc-Switcher-Client\bin\Installer\

    - name: Publish Wrapper (self-contained)
      run: >
        dotnet publish TcNo-Acc-Switcher-Wrapper/TcNo-Acc-Switcher-Wrapper.csproj
        -c Release -r win-x64 --self-contained true
        -o ${{ github.workspace }}\TcNo-Acc-Switcher-Client\bin\Wrapper\

    - name: Build runas
      run: >
        msbuild runas/runas.csproj
        /p:Configuration=${{ env.CONFIGURATION }}
        /p:Platform=${{ env.PLATFORM }}
        /p:OutputPath=${{ github.workspace }}\TcNo-Acc-Switcher-Client\bin\runas\x64\Release\net10.0\

    - name: Build Globals
      run: msbuild TcNo-Acc-Switcher-Globals/TcNo-Acc-Switcher-Globals.csproj /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }}

    - name: Build Tray
      run: msbuild TcNo-Acc-Switcher-Tray/TcNo-Acc-Switcher-Tray.csproj /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }}

    - name: Build Updater
      run: msbuild TcNo-Acc-Switcher-Updater/TcNo-Acc-Switcher-Updater.csproj /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }}

    - name: Build Server
      run: msbuild TcNo-Acc-Switcher-Server/TcNo-Acc-Switcher-Server.csproj /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }}

    - name: Build Client
      run: msbuild TcNo-Acc-Switcher-Client/TcNo-Acc-Switcher-Client.csproj /p:Configuration=${{ env.CONFIGURATION }} /p:Platform=${{ env.PLATFORM }}

    # --- Debug: list output directories to verify paths ---

    - name: List build outputs
      shell: cmd
      run: |
        echo === Installer ===
        dir /B "TcNo-Acc-Switcher-Client\bin\Installer\" 2>nul || echo NOT FOUND
        echo === Wrapper ===
        dir /B "TcNo-Acc-Switcher-Client\bin\Wrapper\" 2>nul || echo NOT FOUND
        echo === runas ===
        dir /B "TcNo-Acc-Switcher-Client\bin\runas\x64\Release\net10.0\" 2>nul || echo NOT FOUND
        echo === Client build ===
        dir /B "TcNo-Acc-Switcher-Client\bin\x64\Release\net10.0-windows10.0.19041.0\" 2>nul || echo NOT FOUND
        echo === Server runtimes ===
        dir /B "TcNo-Acc-Switcher-Server\bin\x64\Release\net10.0\runtimes\win\lib\net10.0\" 2>nul || echo NOT FOUND

    # --- Post-build assembly (replicates PostBuild.bat logic) ---

    - name: Assemble release package
      shell: cmd
      run: |
        set "BUILD_DIR=TcNo-Acc-Switcher-Client\bin\x64\Release\net10.0-windows10.0.19041.0"

        echo --- Copying Installer and runas into build output ---
        copy /B /Y "TcNo-Acc-Switcher-Client\bin\Installer\_First_Run_Installer.exe" "%BUILD_DIR%\_First_Run_Installer.exe"
        copy /B /Y "TcNo-Acc-Switcher-Client\bin\runas\x64\Release\net10.0\runas.exe" "%BUILD_DIR%\runas.exe"
        copy /B /Y "TcNo-Acc-Switcher-Client\bin\runas\x64\Release\net10.0\runas.dll" "%BUILD_DIR%\runas.dll"
        copy /B /Y "TcNo-Acc-Switcher-Client\bin\runas\x64\Release\net10.0\runas.runtimeconfig.json" "%BUILD_DIR%\runas.runtimeconfig.json"

        echo --- Renaming main exes for wrapper pattern ---
        cd "%BUILD_DIR%"
        mkdir updater 2>nul
        ren "TcNo-Acc-Switcher.exe" "TcNo-Acc-Switcher_main.exe"
        ren "TcNo-Acc-Switcher-Server.exe" "TcNo-Acc-Switcher-Server_main.exe"
        ren "TcNo-Acc-Switcher-Tray.exe" "TcNo-Acc-Switcher-Tray_main.exe"
        move /Y "TcNo-Acc-Switcher-Updater.exe" "updater\TcNo-Acc-Switcher-Updater_main.exe"

        echo --- Copying wrapper as main entry points ---
        copy /B /Y "%GITHUB_WORKSPACE%\TcNo-Acc-Switcher-Client\bin\Wrapper\_Wrapper.exe" "TcNo-Acc-Switcher.exe"
        copy /B /Y "%GITHUB_WORKSPACE%\TcNo-Acc-Switcher-Client\bin\Wrapper\_Wrapper.exe" "TcNo-Acc-Switcher-Server.exe"
        copy /B /Y "%GITHUB_WORKSPACE%\TcNo-Acc-Switcher-Client\bin\Wrapper\_Wrapper.exe" "TcNo-Acc-Switcher-Tray.exe"
        copy /B /Y "%GITHUB_WORKSPACE%\TcNo-Acc-Switcher-Client\bin\Wrapper\_Wrapper.exe" "updater\TcNo-Acc-Switcher-Updater.exe"
        copy /B /Y "_First_Run_Installer.exe" "updater\_First_Run_Installer.exe"

        echo --- Copying Server runtimes ---
        xcopy "%GITHUB_WORKSPACE%\TcNo-Acc-Switcher-Server\bin\x64\Release\net10.0\runtimes\win\lib\net10.0" "runtimes\win\lib\net10.0" /E /H /C /I /Y 2>nul

        echo --- Copying updater runtime files ---
        copy /B /Y "VCDiff.dll" "updater\VCDiff.dll" 2>nul
        copy /B /Y "YamlDotNet.dll" "updater\YamlDotNet.dll" 2>nul
        move /Y "TcNo-Acc-Switcher-Updater.runtimeconfig.json" "updater\TcNo-Acc-Switcher-Updater.runtimeconfig.json" 2>nul
        move /Y "TcNo-Acc-Switcher-Updater.pdb" "updater\TcNo-Acc-Switcher-Updater.pdb" 2>nul
        copy /B /Y "TcNo-Acc-Switcher-Updater.dll" "updater\TcNo-Acc-Switcher-Updater.dll" 2>nul
        move /Y "TcNo-Acc-Switcher-Updater.deps.json" "updater\TcNo-Acc-Switcher-Updater.deps.json" 2>nul
        copy /B /Y "Microsoft.IO.RecyclableMemoryStream.dll" "updater\Microsoft.IO.RecyclableMemoryStream.dll" 2>nul
        copy /B /Y "Newtonsoft.Json.dll" "updater\Newtonsoft.Json.dll" 2>nul

        echo --- Removing unused runtimes ---
        if exist "runtimes\linux-arm64" rmdir /Q /S "runtimes\linux-arm64"
        if exist "runtimes\linux-musl-x64" rmdir /Q /S "runtimes\linux-musl-x64"
        if exist "runtimes\linux-x64" rmdir /Q /S "runtimes\linux-x64"
        if exist "runtimes\osx" rmdir /Q /S "runtimes\osx"
        if exist "runtimes\osx-x64" rmdir /Q /S "runtimes\osx-x64"
        if exist "runtimes\unix" rmdir /Q /S "runtimes\unix"
        if exist "runtimes\win-arm64" rmdir /Q /S "runtimes\win-arm64"
        if exist "runtimes\win-x86" rmdir /Q /S "runtimes\win-x86"

        echo --- Renaming wwwroot ---
        ren "wwwroot" "originalwwwroot"

        echo --- Assembly complete ---

    # --- Create compressed archives and installer ---

    - name: Rename build folder and create 7z archive
      shell: cmd
      run: |
        cd TcNo-Acc-Switcher-Client\bin\x64\Release
        ren "net10.0-windows10.0.19041.0" "TcNo-Acc-Switcher"
        7z a -t7z -mmt4 -mx9 "TcNo-Acc-Switcher.7z" ".\TcNo-Acc-Switcher\*"

    - name: Build NSIS installer
      shell: cmd
      run: |
        "C:\Program Files (x86)\NSIS\makensis.exe" "%GITHUB_WORKSPACE%\other\NSIS\nsis-build-x64.nsi"
        move /Y "other\NSIS\TcNo Account Switcher - Installer.exe" "TcNo-Acc-Switcher-Client\bin\x64\Release\TcNo Account Switcher - Installer.exe"

    # --- Run tests ---

    - name: Run tests
      run: dotnet test TcNo-Acc-Switcher-Tests/TcNo-Acc-Switcher-Tests.csproj --no-restore --verbosity normal
      continue-on-error: true

    # --- Upload artifacts ---

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: TcNo Account Switcher - Installer
        path: TcNo-Acc-Switcher-Client\bin\x64\Release\TcNo Account Switcher - Installer.exe

    - name: Upload Portable 7z
      uses: actions/upload-artifact@v4
      with:
        name: TcNo-Acc-Switcher-Portable
        path: TcNo-Acc-Switcher-Client\bin\x64\Release\TcNo-Acc-Switcher.7z

    - name: Upload Full Release Folder
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.date.outputs.date }} Release
        path: TcNo-Acc-Switcher-Client\bin\x64\Release\TcNo-Acc-Switcher

    - name: Upload Debug Build
      if: github.event_name == 'workflow_dispatch'
      run: dotnet build TcNo-Acc-Switcher-Client\TcNo-Acc-Switcher-Client.csproj --configuration Debug

    - name: Upload Debug Artifact
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.date.outputs.date }} Debug
        path: TcNo-Acc-Switcher-Client\bin\Debug\net10.0-windows10.0.19041.0
